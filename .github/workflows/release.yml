# Builds the Fomp installer on a Windows runner. Pushing a version tag
# (e.g. v1.0.1) publishes it as a GitHub release, with the tag's message as
# the notes; a manual run only uploads the installer as an artifact.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Fomp-Setup
          path: release/Fomp-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Fomp-Setup-*.exe \
            --title "Fomp $GITHUB_REF_NAME" --notes-from-tag --verify-tag
